services:
  - type: web
    name: resurgence-city-schools-staff-attendance
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: resurgence-city-schools-staff-attendance-db
          property: connectionString

databases:
  - name: resurgence-city-schools-staff-attendance-db
    plan: free
