name: Package Deployable ZIP
on:
  push:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create deployable ZIP
        run: zip -r resurgence-city-schools-deployable.zip . -x ".git/*" ".github/*"
      - uses: actions/upload-artifact@v4
        with:
          name: resurgence-city-schools-deployable
          path: resurgence-city-schools-deployable.zip
