name: Temporary Syntax Check
on:
  push:
    branches: [ main ]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server/server.js
      - name: Check inline browser JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("public/index.html").read_text()
          a=s.rfind("<script>")
          b=s.rfind("</script>")
          js=s[a+8:b]
          Path("/tmp/app.js").write_text(js)
          PY
          node --check /tmp/app.js
