<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resurgence City Schools</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--p:#123b72;--a:#f0b429;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#687386;--danger:#b42318;--ok:#087443}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:var(--p);color:#fff;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px}.wrap{max-width:1250px;margin:auto;padding:20px}.login{max-width:480px;margin:7vh auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 8px 30px #0001}.login h1{text-align:center;margin:8px 0}.login .logo{display:block;width:90px;height:90px;object-fit:contain;margin:auto}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}.tabs button{border:0;padding:10px 13px;border-radius:9px;background:#e7edf6;color:#18365e}.tabs button.on{background:var(--p);color:#fff}.card{background:var(--card);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 2px 12px #0000000b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #ccd4e0;border-radius:9px;background:#fff}.field textarea{min-height:110px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:9px;padding:10px 15px;background:var(--p);color:#fff}.btn.secondary{background:#687386}.btn.gold{background:var(--a);color:#111}.btn.danger{background:var(--danger)}.btn.ok{background:var(--ok)}.notice{padding:10px 12px;border-radius:9px;background:#eaf7ef;color:var(--ok);margin-bottom:12px}.error{padding:10px 12px;border-radius:9px;background:#fdecec;color:var(--danger);margin-bottom:12px}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e9ef;text-align:left;vertical-align:top}th{background:#f6f8fb}.tablewrap{overflow:auto}.photo{width:100px;height:100px;object-fit:cover;border-radius:10px;border:1px solid #ddd}.preview{display:flex;gap:14px;align-items:center}.idcard{width:360px;min-height:220px;border:2px solid #173e73;border-radius:14px;padding:14px;background:#fff;position:relative;overflow:hidden}.idcard .head{display:flex;gap:8px;align-items:center;border-bottom:1px solid #ddd;padding-bottom:7px}.idcard .head img{width:38px;height:38px;object-fit:contain}.idcard .body{display:flex;gap:12px;padding-top:10px}.idcard .body img.photo2{width:78px;height:88px;object-fit:cover;border-radius:6px}.idcard .qr{margin-left:auto}.idcard small{color:#555}.toolbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}.toolbar button{border:1px solid #ccd4e0;background:#fff;border-radius:6px;padding:6px 9px}.editor{min-height:130px;border:1px solid #ccd4e0;border-radius:9px;padding:10px;background:#fff}.hide{display:none}.stat{padding:16px;border-radius:12px;background:#eef4fb}.stat b{font-size:25px;display:block}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:15px}.modal .box{background:#fff;max-width:520px;width:100%;border-radius:14px;padding:20px}.camera{width:100%;max-height:320px;background:#111;border-radius:10px}.answer{border:1px solid #dde3eb;padding:12px;border-radius:10px;margin-bottom:10px}@media(max-width:800px){.grid,.grid3{grid-template-columns:1fr}.top{position:static}.wrap{padding:12px}.idcard{width:100%;max-width:360px}}
</style></head><body><div id="app"></div>
<script>
const CLASSES=['KG 1','KG2','Nur 1','Nur 2','Primary 1','Primary 2','Primary 3','Primary 4','Primary 5','Jss 1','Jss 2','Jss 3','SS 1','SS 2','SS 3'];
const SUPS=['Nursery — Mrs Kemi Samson','Primary — Miss Victoria Eresanya','Secondary — Mr Michael Peter'];
const KEY='rcs_session';
let token=localStorage.getItem(KEY)||'', me=null, state={}, page='dashboard', photoData='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=> 'RCS-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
const api=async(url,opt={})=>{opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{},token?{Authorization:'Bearer '+token}:{});const r=await fetch(url,opt);let x={};try{x=await r.json()}catch{}if(!r.ok)throw Error(x.error||'Request failed');return x};
function classesOptions(){return CLASSES.map(x=>`<option>${x}</option>`).join('')}
function supOptions(){return SUPS.map(x=>`<option>${x}</option>`).join('')}
function layout(body){document.getElementById('app').innerHTML=`<header class="top"><div class="brand"><img src="/logo.png" onerror="this.style.display='none'"><span>Resurgence City Schools</span></div><div>${esc(me?.name||'')} · ${esc(me?.role||'')} <button class="btn gold" onclick="logout()">Logout</button></div></header><main class="wrap">${body}</main>`}
function login(){document.getElementById('app').innerHTML=`<div class="login"><img class="logo" src="/logo.png" onerror="this.style.display='none'"><h1>Resurgence City Schools</h1><p class="muted" style="text-align:center">Staff & Student Portal</p><div id="msg"></div><div class="field"><label>Username or ID</label><input id="loginUser"></div><div class="field" style="margin-top:10px"><label>Password</label><div style="position:relative"><input id="loginPass" type="password" style="padding-right:48px"><button type="button" aria-label="Show password" onclick="toggleLoginPassword()" style="position:absolute;right:6px;top:5px;height:34px;min-width:38px;border:0;background:transparent;cursor:pointer;font-size:20px" id="loginEye">👁</button></div></div><button class="btn" style="width:100%;margin-top:15px" onclick="doLogin()">Login</button><p class="muted" style="font-size:12px;margin-top:15px">Students and staff use the username/password created by the Admin.</p></div>`}
function toggleLoginPassword(){const p=document.getElementById("loginPass"),b=document.getElementById("loginEye");if(!p)return;if(p.type==="password"){p.type="text";b.textContent="🙈";b.setAttribute("aria-label","Hide password")}else{p.type="password";b.textContent="👁";b.setAttribute("aria-label","Show password")}}
async function doLogin(){const msg=document.getElementById('msg');try{const x=await api('/api/login',{method:'POST',body:JSON.stringify({username:loginUser.value,password:loginPass.value})});token=x.token;me=x.user;state=x.state;localStorage.setItem(KEY,token);localStorage.setItem('rcs_me',JSON.stringify(me));page=me.role==='Admin'?'dashboard':'portal';render()}catch(e){msg.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function logout(){token='';me=null;localStorage.removeItem(KEY);localStorage.removeItem('rcs_me');login()}
function chatUnread(type){const key=type==='teacher'?'rcs_admin_teacher_chat':'rcs_admin_parent_chat';return (state[key]||[]).filter(m=>!m.readBy?.[me?.uid]&&m.fromUid!==me?.uid).length}function nav(){const teacherChatLabel='Teacher Chat'+(chatUnread('teacher')?' 🔔'+chatUnread('teacher'):'');const parentChatLabel='Parent Chat'+(chatUnread('parent')?' 🔔'+chatUnread('parent'):'');if(me.role==='Admin')return [['dashboard','Dashboard'],['student','Register Student'],['staff','Register Staff'],['activitysupervisor','Register Activity Supervisor'],['parent','Register Parent'],['students','Student Records'],['staffs','Staff Records'],['parents','Parent Records'],['activitysupervisors','Activity Supervisors'],['teacherchat',teacherChatLabel],['parentchat',parentChatLabel],['scan','Scan Student Attendance'],['classattendance','Class Attendance'],['assign','Assignments'],['answers','Assignment Answers'],['studentreports','Student Reports'],['reports','Attendance Reports'],['settings','Settings']];if(me.role==='Student')return [['portal','Assignments'],['question','Question to Teacher'],['studentreport','Student Report'],['myanswers','My Answers']];if(me.role==='Parent')return [['parenthome','Children'],['adminchat',parentChatLabel],['parentcomments','Comments'],['parentresults','Results']];if(me.role==='Activity Supervisor')return [['scan','Scan Student Attendance']];return [['portal','Assignments'],['adminchat',teacherChatLabel],['clock','Clock In/Out'],['classattendance','Mark Class Attendance'],['answers','Assignment Responses'],['questions','Student Questions'],['parentmessages','Parent Messages'],['results','Upload Results'],['studentreports','Student Reports'],['daily','Daily Report'],['attendance','My Attendance']]}
function shell(content){layout(`<div class="tabs">${nav().map(([k,v])=>`<button class="${page===k?'on':''}" onclick="page='${k}';render()">${v}</button>`).join('')}</div>${content}`)}
function render(){if(!token){login();return} if(me.role==='Admin')adminRender();else portalRender()}
async function refresh(){const x=await api('/api/state');state=x;render()}
function person(role){return (state.rcs_people||[]).find(p=>p.uid===me.uid)||{}}
function adminRender(){let c='';if(page==='dashboard')c=dashboard();else if(page==='student')c=studentForm();else if(page==='staff')c=staffForm();else if(page==='activitysupervisor')c=activitySupervisorForm();else if(page==='parent')c=parentForm();else if(page==='students')c=peopleTable('Student');else if(page==='staffs')c=peopleTable('Staff');else if(page==='parents')c=peopleTable('Parent');else if(page==='activitysupervisors')c=peopleTable('Activity Supervisor');else if(page==='teacherchat')c=chatForum('teacher');else if(page==='parentchat')c=chatForum('parent');else if(page==='scan')c=scanPage();else if(page==='classattendance')c=classAttendanceAdmin();else if(page==='assign')c=adminAssignments();else if(page==='answers')c=answersTable();else if(page==='studentreports')c=studentReportsTable();else if(page==='reports')c=reports();else c=settings();shell(c)}
function dashboard(){const people=state.rcs_people||[],a=state.rcs_att||[];return `<h2>Admin Dashboard</h2><div class="grid3"><div class="stat"><b>${people.filter(p=>p.role==='Student').length}</b>Students</div><div class="stat"><b>${people.filter(p=>p.role==='Staff').length}</b>Staff</div><div class="stat"><b>${a.length}</b>Attendance events</div></div><div class="card"><h3>Communication Forums</h3><p>Start or continue a school-wide chat with registered teachers or parents.</p><div class="actions"><button class="btn" onclick="openChatPage('teacher')">${chatUnread('teacher')?'🔔 '+chatUnread('teacher')+' new Teacher Chat message(s)':'Open Teacher Chat Forum'}</button><button class="btn gold" onclick="openChatPage('parent')">${chatUnread('parent')?'🔔 '+chatUnread('parent')+' new Parent Chat message(s)':'Open Parent Chat Forum'}</button></div></div><div class="card"><h3>School portal</h3><p>Register students and staff, create ID cards with QR codes, send assignments, receive student responses and manage attendance.</p></div>`}
function photoField(){return `<div class="field full"><label>Photo</label><input type="file" accept="image/*" onchange="readPhoto(this)"><div class="actions"><button class="btn secondary" onclick="openCamera()">Take/Snap Photo</button></div><div id="photoPreview" style="margin-top:8px"></div></div>`}
function studentForm(){return `<h2>Register Student & Create ID Card</h2><div id="formMsg"></div><div class="card"><div class="grid"><div class="field"><label>Name</label><input id="sName"></div><div class="field"><label>Student ID</label><input id="sId" placeholder="Leave blank to generate"></div><div class="field"><label>Class</label><select id="sClass" onchange="toggleDept()">${classesOptions()}</select></div><div class="field" id="deptBox" style="display:none"><label>Department</label><select id="sDept"><option>Science</option><option>Account</option><option>Art</option></select></div><div class="field"><label>Username</label><input id="sUser"></div><div class="field"><label>Password</label><input id="sPass" type="password"></div>${photoField()}</div><div class="actions"><button class="btn" onclick="saveStudent()">Register Student & Generate ID Card</button><button class="btn secondary" onclick="page='students';render()">View Students</button></div></div><div id="cardOut"></div>`}
function toggleDept(){deptBox.style.display=/^SS [123]$/.test(sClass.value)?'block':'none'}
function staffForm(){return `<h2>Register Staff & Create ID Card</h2><div id="formMsg"></div><div class="card"><div class="grid"><div class="field"><label>Surname</label><input id="fSurname"></div><div class="field"><label>First Name</label><input id="fFirst"></div><div class="field"><label>Last Name</label><input id="fLast"></div><div class="field"><label>Supervisor</label><select id="fSup">${supOptions()}</select></div><div class="field"><label>Class</label><select id="fClass">${classesOptions()}</select></div><div class="field"><label>Username</label><input id="fUser"></div><div class="field"><label>Password</label><input id="fPass" type="password"></div>${photoField()}</div><div class="actions"><button class="btn" onclick="saveStaff()">Register Staff & Generate ID Card</button></div></div><div id="cardOut"></div>`}
function activitySupervisorForm(){return `<h2>Register Activity Supervisor</h2><div id="formMsg"></div><div class="card"><div class="grid"><div class="field"><label>Full Name</label><input id="asName"></div><div class="field"><label>Username</label><input id="asUser"></div><div class="field"><label>Password</label><input id="asPass" type="password"></div></div><div class="actions"><button class="btn" onclick="saveActivitySupervisor()">Register Activity Supervisor</button></div></div>`}
async function saveActivitySupervisor(){const name=asName.value.trim(),username=asUser.value.trim(),password=asPass.value;if(!name||!username||!password)return formError('Name, username and password are required.');const id=uid(),p={uid:id,role:'Activity Supervisor',name,staffId:id,active:true},u={uid:id,role:'Activity Supervisor',name,username,password,active:true};try{const people=(state.rcs_people||[]).slice(),users=(state.rcs_users||[]).slice();if(users.some(x=>String(x.username||'').toLowerCase()===username.toLowerCase()))return formError('Username already exists. Choose another username.');people.push(p);users.push(u);let x=await api('/api/snapshot/rcs_people',{method:'POST',body:JSON.stringify({value:people})});state=x.state;x=await api('/api/snapshot/rcs_users',{method:'POST',body:JSON.stringify({value:users})});state=x.state;document.getElementById('formMsg').innerHTML='<div class="notice">Activity Supervisor registration successful.</div>';asName.value='';asUser.value='';asPass.value='';}catch(e){formError(e.message)}}
function readPhoto(inp){const f=inp.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{photoData=rd.result;document.getElementById('photoPreview').innerHTML=`<img class="photo" src="${photoData}">`};rd.readAsDataURL(f)}
function saveStudent(){const name=sName.value.trim(),id=sId.value.trim()||uid(),cls=sClass.value;if(!name||!sUser.value||!sPass.value)return formError('Name, username and password are required.');const p={uid:id,role:'Student',name,studentId:id,className:cls,department:/^SS/.test(cls)?sDept.value:'',photo:photoData||'',active:true};const u={uid:id,role:'Student',name,username:sUser.value,password:sPass.value,active:true};savePerson(p,u,'Student')}
function saveStaff(){const name=[fSurname.value,fFirst.value,fLast.value].filter(Boolean).join(' '),id=uid();if(!name||!fUser.value||!fPass.value)return formError('Name, username and password are required.');const p={uid:id,role:'Staff',name,staffId:id,surname:fSurname.value,firstName:fFirst.value,lastName:fLast.value,supervisor:fSup.value,className:fClass.value,photo:photoData||'',active:true};const u={uid:id,role:'Staff',name,username:fUser.value,password:fPass.value,active:true};savePerson(p,u,'Staff')}
async function savePerson(p,u,role){try{const people=(state.rcs_people||[]).slice(),users=(state.rcs_users||[]).slice();if(users.some(x=>String(x.username||'').toLowerCase()===u.username.toLowerCase()))return formError('Username already exists. Choose another username.');people.push(p);users.push(u);const a=await api('/api/snapshot/rcs_people',{method:'POST',body:JSON.stringify({value:people})});state=a.state;const b=await api('/api/snapshot/rcs_users',{method:'POST',body:JSON.stringify({value:users})});state=b.state;document.getElementById('formMsg').innerHTML='<div class="notice">Registration successful.</div>';document.getElementById('cardOut').innerHTML=role==='Parent'?'<div class="notice">Parent registration successful.</div>':makeCard(p);initCardQR(document.getElementById('cardOut'));photoData='';if(role==='Student'){sName.value='';sId.value='';sUser.value='';sPass.value='';sClass.selectedIndex=0;if(document.getElementById('deptBox'))deptBox.style.display='none';}if(role==='Staff'){fSurname.value='';fFirst.value='';fLast.value='';fUser.value='';fPass.value='';fClass.selectedIndex=0;fSup.selectedIndex=0;}}catch(e){formError(e.message)}}
function formError(x){document.getElementById('formMsg').innerHTML=`<div class="error">${esc(x)}</div>`}
function makeCard(p){const cls=p.className||'',id=p.studentId||p.staffId||p.uid;return `<div class="card"><h3>${p.role} ID Card</h3><div class="idcard"><div class="head"><img src="/logo.png" onerror="this.style.display='none'"><div><b>Resurgence City Schools</b><br><small>${p.role} ID Card</small></div></div><div class="body"><img class="photo2" src="${p.photo||'/logo.png'}"><div><b>${esc(p.name)}</b><br>Class: ${esc(cls||'—')}<br>${p.role==='Student'?'Student ID':'Staff ID'}: ${esc(id)}<br>${p.role==='Staff'?'Supervisor: '+esc(p.supervisor||'—'):p.department?'Department: '+esc(p.department):''}</div><div class="qr" data-qr="${esc(id)}"></div></div><div style="margin-top:8px"><small>${esc(settingsData().address||'School address — add in Settings')}<br>${esc(settingsData().contact||'School contacts — add in Settings')}</small></div></div><div class="actions"><button class="btn gold" onclick="printCard(this)">Print ID Card</button></div></div>`}
function initCardQR(root){if(typeof QRCode==='undefined')return;(root||document).querySelectorAll('.qr[data-qr]').forEach(el=>{if(el.children.length)return;new QRCode(el,{text:el.dataset.qr,width:70,height:70})})}

function printCard(btn){const card=btn.closest('.card').querySelector('.idcard');const w=window.open('','_blank');w.document.write('<html><head><title>ID Card</title><style>body{font-family:Arial;padding:20px}.idcard{width:360px;border:2px solid #173e73;border-radius:14px;padding:14px}.head{display:flex;gap:8px;align-items:center;border-bottom:1px solid #ddd;padding-bottom:7px}.head img{width:38px;height:38px}.body{display:flex;gap:12px;padding-top:10px}.photo2{width:78px;height:88px;object-fit:cover;border-radius:6px}.qr{margin-left:auto}</style></head><body>'+card.outerHTML+'</body></html>');w.document.close();w.print()}
function peopleTable(role){const arr=(state.rcs_people||[]).filter(p=>p.role===role);return `<h2>${role} Records</h2><div class="card tablewrap"><table><tr><th>Name</th><th>ID</th><th>Class/Children</th><th>Username</th><th>Details</th><th>Action</th></tr>${arr.map(p=>{const u=(state.rcs_users||[]).find(x=>x.uid===p.uid)||{};return `<tr><td>${esc(p.name)}</td><td>${esc(p.studentId||p.staffId||p.uid)}</td><td>${role==='Parent'?esc((p.childUids||[]).map(id=>(state.rcs_people||[]).find(c=>c.uid===id)?.name||id).join(', ')):esc(p.className||'')}</td><td>${esc(u.username||'')}</td><td>${role==='Staff'?esc(p.supervisor||''):role==='Parent'?esc(p.telephone||''):esc(p.department||'')}</td><td><button class="btn gold" onclick="editPerson('${p.uid}')">Edit</button> <button class="btn danger" onclick="deletePerson('${p.uid}')">Delete</button> ${role!=='Parent'?`<button class="btn gold" onclick="showExistingCard('${p.uid}')">ID Card</button>`:''}</td></tr>`}).join('')}</table></div>`}

function showExistingCard(id){const p=(state.rcs_people||[]).find(x=>x.uid===id);if(!p)return;document.querySelector('.wrap').insertAdjacentHTML('beforeend',makeCard(p));setTimeout(()=>initCardQR(document.querySelector('.wrap')),50)}
async function deletePerson(id){if(!confirm('Delete this record and login?'))return;try{const x=await api('/api/person/'+encodeURIComponent(id),{method:'DELETE'});state=x.state;render()}catch(e){alert(e.message)}}
function parentForm(){return `<h2>Register Parent</h2><div id="formMsg"></div><div class="card"><div class="grid"><div class="field"><label>Full name</label><input id="pName"></div><div class="field"><label>Address</label><input id="pAddress"></div><div class="field"><label>Telephone</label><input id="pPhone"></div><div class="field"><label>Username</label><input id="pUser"></div><div class="field"><label>Password</label><input id="pPass" type="password"></div></div><h3>Children</h3><p class="muted">Choose a class, then choose the child. Add more rows for children in the same or different classes.</p><div id="childRows">${parentChildRowHTML()}</div><div class="actions"><button class="btn secondary" onclick="addChildRow()">Add Another Child</button><button class="btn" onclick="saveParent()">Register Parent</button></div></div>`;}
function parentChildRowHTML(){return `<div class="childRow card" style="margin-bottom:10px"><div class="grid"><div class="field"><label>Class</label><select class="parentClass" onchange="loadParentChildren(this)">${classesOptions()}</select></div><div class="field"><label>Student — Class Teacher</label><select class="parentChild"><option value="">Choose student</option></select></div></div></div>`;}
function addChildRow(){const box=document.getElementById('childRows');if(!box)return;box.insertAdjacentHTML('beforeend',parentChildRowHTML());loadParentChildren(box.lastElementChild.querySelector('.parentClass'));}
function loadParentChildren(sel){const row=sel.closest('.childRow'),out=row.querySelector('.parentChild'),cls=sel.value;const students=(state.rcs_people||[]).filter(p=>p.role==='Student'&&p.className===cls);const staff=(state.rcs_people||[]).filter(p=>p.role==='Staff'&&p.className===cls);const teacher=staff[0]?.name||'Class teacher not registered';out.innerHTML='<option value="">Choose student</option>'+students.map(p=>`<option value="${p.uid}">${esc(p.name)} — ${esc(teacher)}</option>`).join('');}
async function saveParent(){const name=pName.value.trim(),username=pUser.value.trim(),password=pPass.value;if(!name||!username||!password)return formError('Full name, username and password are required.');const childUids=[...document.querySelectorAll('.parentChild')].map(x=>x.value).filter(Boolean);if(!childUids.length)return formError('Choose at least one child.');if((state.rcs_users||[]).some(x=>String(x.username||'').toLowerCase()===username.toLowerCase()))return formError('Username already exists. Choose another username.');const id=uid(),p={uid:id,role:'Parent',name,address:pAddress.value.trim(),telephone:pPhone.value.trim(),childUids,active:true},u={uid:id,role:'Parent',name,username,password,active:true};try{let people=(state.rcs_people||[]).slice(),users=(state.rcs_users||[]).slice();people.push(p);users.push(u);let x=await api('/api/snapshot/rcs_people',{method:'POST',body:JSON.stringify({value:people})});state=x.state;x=await api('/api/snapshot/rcs_users',{method:'POST',body:JSON.stringify({value:users})});state=x.state;document.getElementById('formMsg').innerHTML='<div class="notice">Parent registration successful.</div>';pName.value='';pAddress.value='';pPhone.value='';pUser.value='';pPass.value='';document.getElementById('childRows').innerHTML='';addChildRow();}catch(e){formError(e.message)}}

function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getGeo(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error('Location is not supported by this device/browser.'));navigator.geolocation.getCurrentPosition(pos=>resolve({latitude:Number(pos.coords.latitude.toFixed(6)),longitude:Number(pos.coords.longitude.toFixed(6)),accuracy:Math.round(pos.coords.accuracy||0),locationTimestamp:new Date(pos.timestamp||Date.now()).toISOString()}),()=>reject(new Error('Location permission is required to record attendance. Please allow location access and try again.')),{enableHighAccuracy:true,timeout:15000,maximumAge:0})})}
function locationText(x){if(x?.latitude==null||x?.longitude==null)return 'Location not captured';const a=x.accuracy?' · ±'+esc(x.accuracy)+'m':'';return '<a href="https://www.google.com/maps?q='+x.latitude+','+x.longitude+'" target="_blank" rel="noopener">GPS: '+esc(x.latitude)+', '+esc(x.longitude)+'</a>'+a}
function classAttendanceTeacher(){const p=person('Staff'),cls=p.className||'',students=(state.rcs_people||[]).filter(x=>x.role==='Student'&&x.className===cls),today=localDate(),existing=(state.rcs_class_attendance||[]).filter(x=>x.className===cls&&x.date===today&&x.staffUid===me.uid);let rows=students.map(s=>{const old=existing.find(x=>x.studentUid===s.uid);return '<tr><td>'+esc(s.name)+'</td><td>'+esc(s.studentId||s.uid)+'</td><td><select class="classAttStatus" data-student="'+esc(s.uid)+'"><option value="Present" '+(old?.status==='Present'?'selected':'')+'>Present</option><option value="Absent" '+(old?.status==='Absent'?'selected':'')+'>Absent</option></select></td></tr>'}).join('');return '<h2>Mark Class Attendance</h2><div class="card"><p><b>Class:</b> '+esc(cls||'Not assigned')+'</p><p><b>Teacher:</b> '+esc(p.name||me.name)+'</p><div class="field"><label>Date</label><input id="classAttDate" type="date" value="'+today+'"></div></div><div class="card tablewrap"><table><tr><th>Student</th><th>Student ID</th><th>Attendance</th></tr>'+(rows||'<tr><td colspan="3">No registered students in your class.</td></tr>')+'</table></div><button class="btn" onclick="saveClassAttendance()">Save Class Attendance</button>'}

async function staffClock(action){let geo;try{geo=await getGeo()}catch(e){alert(e.message);return}const now=new Date(),today=localDate(),arr=(state.rcs_att||[]).slice();if(action==='in'){arr.push({_eventId:'evt-'+Date.now()+'-'+Math.random().toString(36).slice(2),uid:me.uid,name:me.name,date:today,type:'in',in:now.toISOString(),clockIn:now.toISOString(),clockOut:'',out:'',total:'',latitude:geo.latitude,longitude:geo.longitude,accuracy:geo.accuracy,locationTimestamp:geo.locationTimestamp,clockInLocation:{...geo}})}else{const open=[...arr].reverse().find(x=>x.uid===me.uid&&x.date===today&&x.type==='in'&&!x.clockOut);if(!open)return alert('You are not currently clocked in.');open.clockOut=now.toISOString();open.out=now.toISOString();open.total=duration(open.in,open.out);open.type='out';open.clockOutLocation={...geo};open.clockOutLatitude=geo.latitude;open.clockOutLongitude=geo.longitude;open.clockOutAccuracy=geo.accuracy;open.clockOutLocationTimestamp=geo.locationTimestamp}try{const x=await api('/api/attendance/sync',{method:'POST',body:JSON.stringify({value:arr})});state=x.state;render()}catch(e){alert(e.message)}}

async function recordScan(){const id=scanId.value.trim();const p=(state.rcs_people||[]).find(x=>(x.role==='Student')&&(x.uid===id||x.studentId===id));if(!p){scanMsg.innerHTML='<div class="error">Registered student ID not found.</div>';return}let geo;try{geo=await getGeo()}catch(e){scanMsg.innerHTML='<div class="error">'+esc(e.message)+'</div>';return}const now=new Date(),today=localDate(),arr=(state.rcs_att||[]).slice();const open=[...arr].reverse().find(x=>x.uid===p.uid&&String(x.date||'')===today&&x.type==='in'&&!x.clockOut);if(open){open.clockOut=now.toISOString();open.out=now.toISOString();open.total=duration(open.in,open.out);open.type='out';open.clockOutLocation={...geo};open.clockOutLatitude=geo.latitude;open.clockOutLongitude=geo.longitude;open.clockOutAccuracy=geo.accuracy;open.clockOutLocationTimestamp=geo.locationTimestamp}else arr.push({_eventId:'evt-'+Date.now()+'-'+Math.random().toString(36).slice(2),uid:p.uid,name:p.name,date:today,type:'in',in:now.toISOString(),clockIn:now.toISOString(),clockOut:'',out:'',total:'',latitude:geo.latitude,longitude:geo.longitude,accuracy:geo.accuracy,locationTimestamp:geo.locationTimestamp,clockInLocation:{...geo}});try{const x=await api('/api/attendance/sync',{method:'POST',body:JSON.stringify({value:arr})});state=x.state;scanMsg.innerHTML='<div class="notice">'+esc(p.name)+' attendance recorded at '+now.toLocaleTimeString()+'<br>'+locationText(geo)+'</div>'}catch(e){scanMsg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function duration(a,b){if(!a||!b)return'';let m=Math.max(0,Math.round((new Date(b)-new Date(a))/60000));return Math.floor(m/60)+'h '+(m%60)+'m'}
async function startScan(){if(!('BarcodeDetector'in window)){alert('Camera QR scanning is not supported in this browser. Enter the ID manually.');return}const v=document.getElementById('cam');v.classList.remove('hide');const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;const d=new BarcodeDetector({formats:['qr_code']});const loop=async()=>{if(v.readyState>=2){const codes=await d.detect(v);if(codes[0]){scanId.value=codes[0].rawValue;stream.getTracks().forEach(t=>t.stop());v.classList.add('hide');recordScan();return}}requestAnimationFrame(loop)};loop()}

let assignmentFile=null;
function toolbarButtons(id){return ['bold','italic','underline','insertUnorderedList','insertOrderedList'].map(c=>`<button type="button" onclick="document.execCommand('${c}',false,null)">${c==='insertUnorderedList'?'• List':c==='insertOrderedList'?'1. List':c[0].toUpperCase()+c.slice(1)}</button>`).join('')}
async function saveAssignment(){if(!aTitle.value.trim())return alert('Enter an assignment title.');const a={id:uid(),staffUid:me.uid,staffName:me.name,className:aClass.value,title:aTitle.value.trim(),instructions:aEditor.innerHTML,createdAt:new Date().toISOString(),attachment:''};if(assignmentFile)a.attachment=await fileData(assignmentFile);const arr=(state.rcs_assignments||[]).slice();arr.push(a);try{const x=await api('/api/snapshot/rcs_assignments',{method:'POST',body:JSON.stringify({value:arr})});state=x.state;assignmentFile=null;page='assign';render()}catch(e){alert(e.message)}}
function assignmentList(as){return as.length?as.slice().reverse().map(a=>`<div class="answer"><b>${esc(a.title)}</b> · ${esc(a.className)}<div>${a.instructions||''}</div><small>${new Date(a.createdAt||Date.now()).toLocaleString()}</small></div>`).join(''):'<p class="muted">No assignments yet.</p>'}
function portalRender(){if(me.role==='Activity Supervisor')return shell(scanPage());if(me.role==='Parent'){if(page==='adminchat')return shell(chatForum('parent'));if(page==='parentcomments')return shell(parentComments());if(page==='parentresults')return shell(parentResults());return shell(notificationBanner()+parentHome())}const note=notificationBanner();if(page==='portal')return shell(note+`<h2>${me.role==='Student'?'Student':'Staff'} Assignment Portal</h2>${me.role==='Student'?studentAssignments():staffAssignments()}`);if(page==='myanswers')return shell(`<h2>My Answers</h2>${studentMyAnswers()}`);if(page==='question')return shell(studentQuestion());if(page==='studentreport')return shell(studentReportForm());if(page==='answers')return shell(`<h2>Assignment Responses</h2>${answersTable()}`);if(page==='questions')return shell(studentQuestions());if(page==='parentmessages')return shell(parentMessages());if(page==='results')return shell(resultUpload());if(page==='studentreports')return shell(studentReportsTable());if(page==='clock')return shell(staffClockPage());if(page==='classattendance')return shell(classAttendanceTeacher());if(page==='daily')return shell(dailyReport());if(page==='adminchat')return shell(chatForum('teacher'));return shell(`<h2>My Attendance</h2>${myAttendance()}`)}
function studentAssignments(){const as=state.rcs_assignments||[];return `<div class="card">${as.length?as.slice().reverse().map(a=>`<div class="answer"><h3>${esc(a.title)}</h3><p><b>Class:</b> ${esc(a.className)}</p><div>${a.instructions||''}</div>${a.attachment?`<p><a href="${a.attachment}" target="_blank">Open attachment</a></p>`:''}<h4>Your response</h4><div class="toolbar">${toolbarButtons('resp-'+a.id)}</div><div id="resp-${a.id}" class="editor" contenteditable="true"></div><div class="field" style="margin-top:8px"><label>Theory answer / details</label><textarea id="txt-${a.id}"></textarea></div><input type="file" accept="image/*,.pdf,.doc,.docx" id="file-${a.id}"><div class="actions"><button class="btn" onclick="submitAnswer('${a.id}')">Submit Answer</button><button class="btn secondary" onclick="snapAnswer('${a.id}')">Snap/Upload</button></div></div>`).join(''):'<p class="muted">No assignments have been sent to your class.</p>'}</div>`}
async function submitAnswer(id){const a=(state.rcs_assignments||[]).find(x=>x.id===id);if(!a)return;const f=document.getElementById('file-'+id).files[0],att=f?await fileData(f):'';const arr=(state.rcs_answers||[]).filter(x=>x.assignmentId!==id||x.studentUid!==me.uid);arr.push({id:uid(),assignmentId:id,studentUid:me.uid,studentName:me.name,staffUid:a.staffUid,staffName:a.staffName,className:person('Student').className||'',formattedAnswer:document.getElementById('resp-'+id).innerHTML,theoryAnswer:document.getElementById('txt-'+id).value,attachment:att,submittedAt:new Date().toISOString()});try{const x=await api('/api/snapshot/rcs_answers',{method:'POST',body:JSON.stringify({value:arr})});state=x.state;alert('Answer submitted successfully.')}catch(e){alert(e.message)}}
function snapAnswer(id){document.getElementById('file-'+id).click()}
function studentMyAnswers(){return `<div class="card">${(state.rcs_answers||[]).map(a=>`<div class="answer"><b>${esc(a.studentName)}</b> · ${new Date(a.submittedAt).toLocaleString()}<div>${a.formattedAnswer||''}</div><p>${esc(a.theoryAnswer||'')}</p>${a.attachment?'<p>Attachment submitted.</p>':''}</div>`).join('')||'<p class="muted">No answers submitted.</p>'}</div>`}
function staffAssignments(){return `<div class="card"><h3>Create Assignment</h3><div class="grid"><div class="field"><label>Send To Class</label><select id="aClass"><option>All Classes</option>${classesOptions()}</select></div><div class="field"><label>Title</label><input id="aTitle"></div><div class="field full"><label>Question / Instructions</label><div class="toolbar">${toolbarButtons('aEditor')}</div><div id="aEditor" class="editor" contenteditable="true"></div></div><div class="field"><label>Upload File</label><input id="aFile" type="file" accept="image/*,.pdf,.doc,.docx" onchange="assignmentFile=this.files[0]"></div></div><button class="btn" onclick="saveAssignment()">Send Assignment To Students</button></div><div class="card"><h3>My Assignments</h3>${assignmentList((state.rcs_assignments||[]).filter(a=>a.staffUid===me.uid))}</div>`}
function answersTable(){const as=state.rcs_answers||[];return `<div class="card"><p class="muted">Student answers submitted to staff/admin.</p>${as.slice().reverse().map(a=>`<div class="answer"><b>${esc(a.studentName)}</b> · Class: ${esc(a.className||'')}<br><small>${new Date(a.submittedAt||Date.now()).toLocaleString()}</small><div style="margin-top:7px">${a.formattedAnswer||''}</div><p><b>Theory:</b> ${esc(a.theoryAnswer||'')}</p>${a.attachment?'<p>Attachment included.</p>':''}</div>`).join('')||'<p>No responses yet.</p>'}</div>`}
function dailyReport(){const p=person('Staff');return `<h2>Daily Activities Report</h2><div class="card"><div class="grid"><div class="field"><label>Name</label><input value="${esc(p.name)}" disabled></div><div class="field"><label>Class</label><input value="${esc(p.className||'')}" disabled></div><div class="field"><label>Supervisor</label><input value="${esc(p.supervisor||'')}" disabled></div><div class="field"><label>Date</label><input id="dDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field full"><label>Major challenges that affected your performance</label><textarea id="dChallenge"></textarea></div><div class="field full"><label>Major achievements at work today</label><textarea id="dAchieve"></textarea></div><div class="field full"><label>General report on incidents and activities done according to your job role</label><textarea id="dGeneral"></textarea></div><div class="field full"><label>Unfinished task for next shift? If yes, give details</label><textarea id="dNext"></textarea></div><div class="field"><label>Mode of Supervision</label><select id="dMode"><option>onsight</option><option>remote</option></select></div></div><button class="btn" onclick="submitDaily()">Submit Daily Report</button></div>`}
async function submitDaily(){const arr=(state.resurgence_daily_reports||[]).filter(r=>!(r.uid===me.uid&&r.date===dDate.value));arr.push({uid:me.uid,name:me.name,date:dDate.value,className:person('Staff').className||'',supervisor:person('Staff').supervisor||'',challenges:dChallenge.value,achievements:dAchieve.value,general:dGeneral.value,nextShift:dNext.value,supervision:dMode.value,submittedAt:new Date().toISOString()});try{const x=await api('/api/snapshot/resurgence_daily_reports',{method:'POST',body:JSON.stringify({value:arr})});state=x.state;alert('Daily report submitted.')}catch(e){alert(e.message)}}
function myAttendance(){return `<div class="card tablewrap"><table><tr><th>Date</th><th>Clock In</th><th>Clock Out</th><th>Total</th></tr>${(state.rcs_att||[]).map(x=>`<tr><td>${esc(x.date||'')}</td><td>${x.in?new Date(x.in).toLocaleTimeString():''}</td><td>${x.out?new Date(x.out).toLocaleTimeString():''}</td><td>${esc(x.total||'')}</td></tr>`).join('')}</table></div>`}
function reports(){const a=state.rcs_att||[];return `<h2>Attendance Reports</h2><div class="card"><button class="btn" onclick="downloadCSV()">Download CSV</button> <button class="btn gold" onclick="window.print()">Print / Save PDF</button></div><div class="card tablewrap"><table><tr><th>Name</th><th>Date</th><th>In</th><th>Out</th><th>Total</th><th>Clock In Location</th><th>Clock Out Location</th></tr>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.date)}</td><td>${x.in?new Date(x.in).toLocaleTimeString():''}</td><td>${x.out?new Date(x.out).toLocaleTimeString():''}</td><td>${esc(x.total)}</td><td>${x.clockInLocation?locationText(x.clockInLocation):locationText(x)}</td><td>${x.clockOutLocation?locationText(x.clockOutLocation):''}</td></tr>`).join('')}</table></div>`}
function downloadCSV(){const rows=[['Name','Date','Clock In','Clock Out','Total','Clock In Latitude','Clock In Longitude','Clock Out Latitude','Clock Out Longitude']].concat((state.rcs_att||[]).map(x=>[x.name,x.date,x.in||'',x.out||'',x.total||'',x.clockInLocation?.latitude??x.latitude??'',x.clockInLocation?.longitude??x.longitude??'',x.clockOutLocation?.latitude??x.clockOutLatitude??'',x.clockOutLocation?.longitude??x.clockOutLongitude??'']));const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='resurgence-city-schools-attendance.csv';a.click()}
function settingsData(){return JSON.parse(localStorage.getItem('rcs_settings')||'{}')}
function settings(){const s=settingsData();return `<h2>Settings</h2><div class="card"><p>These details appear on generated ID cards. They are not invented or pre-filled because the exact school contact details were not supplied.</p><div class="grid"><div class="field full"><label>School Address</label><input id="setAddress" value="${esc(s.address||'')}"></div><div class="field full"><label>School Contacts (phone/email/website)</label><input id="setContact" value="${esc(s.contact||'')}"></div></div><button class="btn" onclick="localStorage.setItem('rcs_settings',JSON.stringify({address:setAddress.value,contact:setContact.value}));alert('Settings saved')">Save ID Card Details</button></div><div class="card"><button class="btn" onclick="exportBackup()">Export Database Backup</button></div>`}
async function exportBackup(){const r=await fetch('/api/export',{headers:{Authorization:'Bearer '+token}});const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='resurgence-city-schools-backup.json';a.click()}
async function fileData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function openCamera(){const m=document.querySelector('.modal')||createModal();m.style.display='flex';m.querySelector('.box').innerHTML=`<h3>Take Photo</h3><video id="photoCam" class="camera" autoplay playsinline></video><div class="actions"><button class="btn" onclick="capturePhoto()">Capture</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`;navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(s=>{m.dataset.stream='yes';photoStream=s;photoCam.srcObject=s}).catch(e=>alert(e.message))}
let photoStream=null;function createModal(){const d=document.createElement('div');d.className='modal';d.innerHTML='<div class="box"></div>';document.body.appendChild(d);return d}function closeModal(){const m=document.querySelector('.modal');if(photoStream)photoStream.getTracks().forEach(t=>t.stop());photoStream=null;if(m)m.style.display='none'}function capturePhoto(){const v=document.getElementById('photoCam'),c=document.createElement('canvas');c.width=v.videoWidth||640;c.height=v.videoHeight||480;c.getContext('2d').drawImage(v,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.8);const pv=document.getElementById('photoPreview');if(pv)pv.innerHTML=`<img class="photo" src="${photoData}">`;closeModal()}
(async()=>{try{if(token){const x=await api('/api/state');state=x;const payload=JSON.parse(localStorage.getItem('rcs_me')||'null');if(payload)me=payload}if(!me&&token){localStorage.removeItem(KEY);token=''}if(me)render();else login()}catch(e){localStorage.removeItem(KEY);token='';login()}})();
window.addEventListener('beforeunload',()=>{if(photoStream)photoStream.getTracks().forEach(t=>t.stop())});
</script></body></html>
